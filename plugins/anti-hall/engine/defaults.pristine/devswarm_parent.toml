# ah-engine shipped defaults for the DevSwarm Primary prompt hook (`ah-engine check devswarm-parent-inbox`, script
# `logic/devswarm-parent-inbox.js`), the engine's port of `hooks/devswarm-parent-inbox.js` for a Primary that runs inside a git
# checkout. Format: see the header of engine.toml. The texts are the Node hook's own, word for word; a `{name}` is filled in at
# run time. Keys shared with the other prompt hooks stay in small_guards.toml (devswarm_prompt.*).

[devswarm_parent.defer_log_kind]
doc = "The kind of the engine event-log line a deferral of the Primary prompt hook to its Node hook writes (the line's text names the cause, so every deferral is countable)."
value = "parent-inbox-defer"

[devswarm_parent.notices_file]
doc = "The maintainer-notice feed (companion/lib/devswarm-maintainer-notice.js noticesPath), under the DevSwarm directory. While it exists the hook's notice segment may speak, which the engine leaves to Node."
value = "maintainer-notices.jsonl"

[devswarm_parent.escalation_banner]
doc = "The segment that names supervisor escalations parked because this Primary is not registered in the mesh store (companion/lib/recovery.js parkedEscalationSegment). Placeholders: {count}, {kids} (the child ids, JSON-quoted and comma-separated), {parent}, {cli}."
value = "⚠️ anti-hall · devswarm-escalations: not delivered ({count}): the supervisor escalated {kids} (idle — reassign or archive), but this Primary ({parent}) is not registered in the mesh store (or its lock was busy), so the notice is PARKED. Run `node {cli} register-primary` — the next supervisor sweep then delivers it."

[devswarm_parent.segment_joiner]
doc = "Between the segments of the Primary prompt hook's answer (additionalContext)."
value = "\n\n"

[devswarm_parent.archive_ignore_dir]
doc = "The directory of the per-workspace archive-ignore marks (companion/lib/row-eligibility.js archiveIgnored), under the DevSwarm directory: a workspace with a mark is still tracked but never recommended for archiving."
value = "archive-ignore"

[devswarm_parent.max_listed]
doc = "Most workspaces the nudge segments name inline (hooks/devswarm-parent-inbox.js MAX_LISTED); the rest are counted."
value = 6

[devswarm_parent.max_table_rows]
doc = "Most rows of the live workspace table (MAX_TABLE_ROWS; ANTIHALL_ROSTER_MAX_ROWS overrides); the rest are folded into a \"+N more\" line."
value = 12

[devswarm_parent.title_max]
doc = "Longest workspace title the nudge segments show before it is cut with an ellipsis (truncateTitle)."
value = 48

[devswarm_parent.trend_log_max_bytes]
doc = "Largest parent-inbox.log the unread trend reads (MAX_TREND_LOG_BYTES); past it no trend is shown."
value = 2097152

[devswarm_parent.archive_cooldown_ms]
doc = "How long an archive recommendation for one workspace stays silent before it repeats (liveness.js DEFAULT_COOLDOWN_MS)."
value = 600000

[devswarm_parent.stuck_statuses]
doc = "Supervisor verdicts that mean a child is wedged (STUCK_STATUSES)."
value = ["stale", "nudged", "escalated"]

[devswarm_parent.high_urgencies]
doc = "Message urgencies that make an unread backlog an urgent one (isHighUrgency)."
value = ["urgent", "high"]

[devswarm_parent.low_urgency]
doc = "The urgency that keeps an unread backlog out of the normal nudge tier (tierOf)."
value = "low"

[devswarm_parent.env_roster_hide]
doc = "Variable that turns the \"+N archived\" collapse of the table off when it is \"0\" (ANTIHALL_ROSTER_HIDE_ARCHIVED)."
value = "ANTIHALL_ROSTER_HIDE_ARCHIVED"

[devswarm_parent.roster_hide_off]
doc = "The value of the roster-hide variable that shows archived rows."
value = "0"

[devswarm_parent.env_roster_max]
doc = "Variable that sets the most rows of the table (ANTIHALL_ROSTER_MAX_ROWS)."
value = "ANTIHALL_ROSTER_MAX_ROWS"

[devswarm_parent.env_focus_ms]
doc = "Variable that sets how long a selection in the DevSwarm app counts as the owner looking at it (ANTIHALL_DEVSWARM_FOCUS_MS; 0 disables)."
value = "ANTIHALL_DEVSWARM_FOCUS_MS"

[devswarm_parent.focus_default_ms]
doc = "How long a selection in the DevSwarm app counts as the owner looking at it when the variable is not a number (devswarm-app-db.js FOCUS_WINDOW_MS)."
value = 120000

[devswarm_parent.set_grace]
doc = "Setting devswarm.inboxGraceSec: seconds a fresh unread message to a live child is not yet neglect. The engine answers only while it is unset, with this default."
value = { section = "devswarm", key = "inboxGraceSec", env = "ANTIHALL_DEVSWARM_INBOX_GRACE_SEC", option = "", default = 120 }

[devswarm_parent.set_renag]
doc = "Setting devswarm.archiveRequestRenagHours: hours a pending archive-request suppresses the nag before it repeats. The engine answers only while it is unset, with this default."
value = { section = "devswarm", key = "archiveRequestRenagHours", env = "ANTIHALL_DEVSWARM_ARCHIVE_REQUEST_RENAG_HOURS", option = "", default = 24 }

[devswarm_parent.set_auto_archive]
doc = "Setting devswarm.autoArchive.mode: with the supervisor archiving a finished workspace itself the hook does not recommend archiving it. The engine answers only while it is unset (the shipped mode is on, which it checks against the supervisor's last sweep)."
value = { section = "devswarm", key = "autoArchive.mode", env = "", option = "", default = "on" }

[devswarm_parent.ms_per_hour]
doc = "Milliseconds in an hour (the renag setting is in hours)."
value = 3600000

[devswarm_parent.dir_archive_nudges]
doc = "The per-workspace archive-recommendation records (archive-nudges/<id>.json), under the DevSwarm directory."
value = "archive-nudges"

[devswarm_parent.file_log]
doc = "The parent-inbox acceptance log (parent-inbox.log), under the DevSwarm directory."
value = "parent-inbox.log"

[devswarm_parent.file_auto_archive]
doc = "The supervisor's auto-archive sweep record (auto-archive-state.json), under the DevSwarm directory."
value = "auto-archive-state.json"

[devswarm_parent.dir_ui_sync]
doc = "The once-per-session ask markers (ui-sync-asks), under the DevSwarm directory."
value = "ui-sync-asks"

[devswarm_parent.labels]
doc = "Row labels of the live workspace table with their sort rank in tenths (displayStatus and the label assignment of the roster loop: the Node ranks 0, 1, 1.5, 2, 3, 4, 5, 5.5 and 6, times ten, because a defaults file holds integers only)."
value = { escalated = { label = "escalated", rank = 0 }, stale = { label = "stale", rank = 10 }, not_draining = { label = "not-draining", rank = 15 }, archive_ready = { label = "archive-ready", rank = 20 }, idle_alive = { label = "idle (alive)", rank = 30 }, idle = { label = "idle", rank = 30 }, active = { label = "active", rank = 40 }, dormant = { label = "dormant", rank = 50 }, superseded = { label = "archived-superseded (live child)", rank = 55 }, archived = { label = "archived", rank = 60 } }

[devswarm_parent.stale_build_label]
doc = "The label of a row whose child runs an older anti-hall build than the machine's newest; {version} is the recorded version. Its rank is the not-draining rank."
value = "stale anti-hall {version}"

[devswarm_parent.relative_none]
doc = "What a relative age shows when the time is unknown."
value = "—"

[devswarm_parent.table_head]
doc = "The head of the live workspace table: the title line and the column header."
value = "💡 anti-hall · devswarm-workspaces: (re-sent on change, else every 10 turns):\n| workspace | status | finish | unread | last |\n|---|---|---|---|---|"

[devswarm_parent.table_row]
doc = "One table row. Placeholders: {workspace}, {label}, {finish}, {unread}, {last}."
value = "| {workspace} | {label} | {finish} | {unread} | {last} |"

[devswarm_parent.legend_dormant]
doc = "The line under the table that explains a dormant row, shown only when one is listed."
value = "dormant = no recent activity signal; often a workspace already CLOSED in the app — verify before nagging to close. If it has unread or a pending question, still answer it."

[devswarm_parent.legend_not_draining]
doc = "The line under the table that explains a not-draining row, shown only when one is listed."
value = "not-draining = a union-unread backlog has sat undrained >20m — a coordination signal independent of activity/liveness; poke or escalate, report/escalate only, never auto-killed."

[devswarm_parent.overflow]
doc = "The table line for rows past the cap. Placeholders: {hidden}, {max}."
value = "+{hidden} more (capped at {max})"

[devswarm_parent.overflow_ids]
doc = "What follows the overflow line when the hidden rows are named. Placeholder: {ids}."
value = ": {ids}"

[devswarm_parent.overflow_ids_more]
doc = "What ends the named hidden rows when there are more than eight."
value = ", …"

[devswarm_parent.overflow_named_max]
doc = "Most hidden rows the overflow line names."
value = 8

[devswarm_parent.archived_hidden]
doc = "The table line for archived rows left out of the roster. Placeholder: {n}."
value = "+{n} archived (done; set ANTIHALL_ROSTER_HIDE_ARCHIVED=0 to show)"

[devswarm_parent.title_instruction]
doc = "The reminder that follows a newly sent table: name a workspace by its title."
value = "When mentioning a workspace to the human, use its TITLE from the table above (truncate ~48 chars) — NEVER the bare mesh id. Mesh ids belong ONLY inside command strings (`send --to <meshId>`, etc)."

[devswarm_parent.risk_local_only]
doc = "The title-cell marker of a branch with no upstream."
value = "local only (not pushed)"

[devswarm_parent.risk_unpushed]
doc = "The title-cell marker of unpushed commits. Placeholder: {n}."
value = "⚠ {n} unpushed"

[devswarm_parent.risk_merged_unverified]
doc = "The title-cell marker of an archive-ready row whose merge was never proven."
value = "merged (unverified)"

[devswarm_parent.mark_pinned]
doc = "Title-cell marker: pinned in the DevSwarm app."
value = "pinned"

[devswarm_parent.mark_on_screen]
doc = "Title-cell marker: the owner has the workspace on screen."
value = "on screen"

[devswarm_parent.mark_brief_not_delivered]
doc = "Title-cell marker: the brief was never delivered."
value = "⚠ brief not delivered"

[devswarm_parent.mark_brief_withheld]
doc = "Title-cell marker: the brief was withheld."
value = "⚠ brief withheld"

[devswarm_parent.brief_not_delivered]
doc = "The app database word for a brief that was not delivered."
value = "not-delivered"

[devswarm_parent.brief_withheld]
doc = "The app database word for a brief that was withheld."
value = "withheld"

[devswarm_parent.done_merged]
doc = "Finish cell: done and the merge is proven."
value = "done ✓ merged"

[devswarm_parent.done_not_merged]
doc = "Finish cell: done and the merge was checked and is false."
value = "done, not merged"

[devswarm_parent.done_unverified]
doc = "Finish cell: done, merge never checked."
value = "done, merge unverified"

[devswarm_parent.working]
doc = "Finish cell: no done report yet."
value = "working"

[devswarm_parent.working_pct]
doc = "Finish cell: no done report yet, with the heartbeat progress. Placeholder: {pct}."
value = "working ({pct}%)"

[devswarm_parent.unread_head]
doc = "The nudge segment for workspaces that need attention. Placeholders: {count}, {shown}, {extra}."
value = "⚠️ anti-hall · devswarm-parent-inbox: {count} active workspace(s) need attention — {shown}{extra}. "

[devswarm_parent.unread_extra]
doc = "The nudge segment's count of workspaces past the inline list. Placeholder: {n}."
value = " +{n} more"

[devswarm_parent.unread_title_parts]
doc = "A listed workspace's parts. Placeholders: {title}, {parts}."
value = "{title} ({parts})"

[devswarm_parent.part_unread]
doc = "A workspace part: its unread count. Placeholder: {n}."
value = "{n} unread"

[devswarm_parent.part_not_draining]
doc = "A workspace part: its backlog has not drained."
value = "NOT DRAINING >20m"

[devswarm_parent.part_oldest]
doc = "A workspace part: the age of its oldest unread. Placeholder: {age}."
value = "oldest {age}"

[devswarm_parent.part_joiner]
doc = "Between the parts of a listed workspace."
value = ", "

[devswarm_parent.shown_joiner]
doc = "Between the listed workspaces."
value = "; "

[devswarm_parent.unread_body_drain]
doc = "The nudge text when some listed workspace holds unread. Placeholder: {cli}."
value = "CHILD NOT DRAINING: these are message(s) YOU sent that the child has NOT yet drained. Poke it (`node {cli} send --to <id> --message-file <path>`) or escalate/reassign it — do not assume it has seen the backlog just because time has passed. "

[devswarm_parent.unread_body_read]
doc = "The nudge text when none of the listed workspaces holds unread."
value = "Read/ack each workspace inbox (or reassign/archive it) so it does not sit unnoticed off your task list. "

[devswarm_parent.unread_tail]
doc = "The last sentence of the nudge segment."
value = "A workspace flagged stale/escalated has a wedged child — check on it."

[devswarm_parent.urgent_head]
doc = "The nudge segment for an urgent unread message. Placeholders: {count}, {shown}, {extra}, {cli}."
value = "⚠️ anti-hall · devswarm-urgent-inbox: {count} workspace(s) have an URGENT/HIGH-priority direct message waiting, unread — {shown}{extra}. CHILD NOT DRAINING: STOP and poke it NOW (`node {cli} send --to <id> --message-file <path>`) or escalate — do not wait to see if it drains on its own — before continuing."

[devswarm_parent.urgent_part]
doc = "A workspace of the urgent segment. Placeholders: {id}, {parts}."
value = "{id} ({parts})"

[devswarm_parent.archive_head]
doc = "The archive-ready recommendation. Placeholders: {shown}, {extra}, {cli}."
value = "💡 anti-hall · devswarm-archive-ready: workspace(s) {shown}{extra} are complete (all required gates met). VERIFY this workspace is MERGED + TESTED + DEPLOYED per YOUR repo's policy (using your own tooling; anti-hall does not check this), then run `node {cli} archive-request <id>` to ask the child to archive. NEVER archive mechanically; the child asks its user."

[devswarm_parent.archive_extra]
doc = "The archive recommendation's count past the inline list. Placeholder: {n}."
value = " (+{n} more)"

[devswarm_parent.archive_ids_joiner]
doc = "Between the ids the archive recommendation names."
value = ", "

[devswarm_parent.rising]
doc = "The unread trend word when the backlog grew since the last injection."
value = "rising"

[devswarm_parent.flat]
doc = "The unread trend word when the backlog is unchanged."
value = "flat"

[devswarm_parent.falling]
doc = "The unread trend word when the backlog shrank."
value = "falling"
