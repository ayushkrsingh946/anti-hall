[package]
name = "ah-hook"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Thin hook launcher for ah-engine: watchdog, fail-open/fail-closed outcome table, cold-start guard wait"

[[bin]]
name = "ah-hook"
path = "src/main.rs"

[dependencies]
# kill(2)/killpg for the process-group watchdog; std has no signal API
libc = "0.2.190"
# A/B only: the established TOML parser in place of the line reader (`--features toml-crate`)
toml = { version = "1.1.6", default-features = false, features = ["parse"], optional = true }

[features]
toml-crate = ["dep:toml"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
